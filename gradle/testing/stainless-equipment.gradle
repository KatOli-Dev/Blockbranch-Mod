def foundationCatalogClasses=layout.buildDirectory.dir('historical-metallurgy-v7')
def foundationCatalogSource=file('src/integrationTest/resources/blockbranch-fixtures/metallurgy-catalog-v7/blockbranch/cubic/ColumnWorldFormat.java')
def foundationCatalogOrigin=file('src/integrationTest/resources/blockbranch-fixtures/metallurgy-catalog-v7/ORIGIN.json')
def foundationCatalogCompile=tasks.register('compileLegacyStainlessCatalog',JavaCompile){
 dependsOn tasks.named('compileJava');source(foundationCatalogSource);inputs.file(foundationCatalogOrigin)
 classpath=sourceSets.main.compileClasspath+sourceSets.main.output;destinationDirectory.set(foundationCatalogClasses)
 javaCompiler.set(javaToolchains.compilerFor{languageVersion.set(JavaLanguageVersion.of(25))})
 options.release.set(25);options.compilerArgs.add('-proc:none')
 doFirst{def origin=new groovy.json.JsonSlurper().parse(foundationCatalogOrigin);assert java.security.MessageDigest.getInstance('SHA-256').digest(foundationCatalogSource.bytes).encodeHex().toString()==origin.sha256:'Frozen catalog7 input changed'}
}

loom.runs.named('metallurgySmoke'){vmArg('-Dblockbranch.oldStainlessCatalogClasses='+foundationCatalogClasses.get().asFile.absolutePath)}
tasks.named('runMetallurgySmoke'){dependsOn foundationCatalogCompile}
if(providers.gradleProperty('stainlessEquipmentView').isPresent()){
 loom.runs.named('metallurgyViewServer'){vmArg('-Dblockbranch.stainlessEquipmentView=true')}
 loom.runs.named('metallurgyViewClient'){vmArg('-Dblockbranch.stainlessEquipmentView=true')}
}
def stainlessGearResources=layout.projectDirectory.dir('src/main/resources').asFile
def stainlessGearNames=['sword','axe','shovel','hoe','helmet','chestplate','leggings','boots'].collect{'stainless_steel_'+it}
tasks.register('verifyStainlessEquipmentResources'){
 inputs.files(stainlessGearNames.collectMany{n->['assets/blockbranch/items/'+n+'.json','assets/blockbranch/models/item/'+n+'.json','assets/blockbranch/textures/item/'+n+'.png','data/blockbranch/recipe/'+n+'.json','data/blockbranch/advancement/recipes/metallurgy/'+n+'.json'].collect{new File(stainlessGearResources,it)}})
 inputs.files(fileTree(stainlessGearResources){include '**/models/item/stainless_steel_*_trim.json','**/equipment/stainless_steel.json','**/equipment/*/stainless_steel.png','**/tags/item/*.json','**/lang/en_us.json'})
 doLast{
  def read={String path->new groovy.json.JsonSlurper().parse(new File(stainlessGearResources,path))};def names=read('assets/blockbranch/lang/en_us.json')
  for(def n:stainlessGearNames){def image=javax.imageio.ImageIO.read(new File(stainlessGearResources,'assets/blockbranch/textures/item/'+n+'.png'));assert image.width==16&&image.height==16:'Keep gear icons 16x';def item=read('assets/blockbranch/items/'+n+'.json').model;def armor=n in ['stainless_steel_helmet','stainless_steel_chestplate','stainless_steel_leggings','stainless_steel_boots'];assert armor?(item.type=='minecraft:select'&&item.property=='minecraft:trim_material'&&item.fallback.model=='blockbranch:item/'+n):(item.type=='minecraft:model'&&item.model=='blockbranch:item/'+n);assert names['item.blockbranch.'+n];def recipe=read('data/blockbranch/recipe/'+n+'.json');assert recipe.result.id=='blockbranch:'+n;def unlock=read('data/blockbranch/advancement/recipes/metallurgy/'+n+'.json');assert unlock.criteria.has_the_recipe.conditions.recipes=='blockbranch:'+n&&unlock.rewards.recipes==['blockbranch:'+n];assert unlock.requirements.flatten().toSet()==unlock.criteria.keySet()}
  for(def row:[['sword','swords'],['axe','axes'],['shovel','shovels'],['hoe','hoes'],['helmet','head_armor'],['chestplate','chest_armor'],['leggings','leg_armor'],['boots','foot_armor']]){def t=read('data/minecraft/tags/item/'+row[1]+'.json');assert t.replace==false&&t.values.contains('blockbranch:stainless_steel_'+row[0])}
  for(def n:['helmet','chestplate','leggings','boots']){def item=read('assets/blockbranch/items/stainless_steel_'+n+'.json').model;assert item.cases.size()==11;for(def entry:item.cases){def key=entry.when.substring('minecraft:'.length());def m=read('assets/blockbranch/models/item/stainless_steel_'+n+'_'+key+'_trim.json');assert entry.model.model=='blockbranch:item/stainless_steel_'+n+'_'+key+'_trim'&&m.textures.layer0=='blockbranch:item/stainless_steel_'+n&&m.textures.layer1=='minecraft:trims/items/'+n+'_trim_'+key:'Keep native resource-pack trim compositing'}}
  def layers=read('assets/blockbranch/equipment/stainless_steel.json').layers;for(def layer:['humanoid','humanoid_leggings','humanoid_baby']){assert layers[layer][0].texture=='blockbranch:stainless_steel';def image=javax.imageio.ImageIO.read(new File(stainlessGearResources,'assets/blockbranch/textures/entity/equipment/'+layer+'/stainless_steel.png'));assert image.width==64&&image.height==(layer=='humanoid_baby'?64:32):'Native wearable UV dimensions';int clear=0,solid=0;for(int y=0;y<image.height;y++)for(int x=0;x<image.width;x++){int a=image.getRGB(x,y)>>>24;if(a==0)clear++;if(a==255)solid++};assert clear>0&&solid>0:'Keep open skin and armor plates'}
  println 'PASS stainless equipment: eight items/icons/recipe-unlock pairs, 44 native trim models and three original wearable atlases'
 }
}
tasks.named('check'){dependsOn tasks.named('verifyStainlessEquipmentResources')}
