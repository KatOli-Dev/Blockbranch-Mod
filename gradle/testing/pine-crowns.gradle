// Native views of the audited seed-424242 old-growth-pine-taiga scene at fixed poses: the bundled preset versus any gate-absent preset
// passed by -PpineCrownsVisualPreset/-PpineCrownsVisualGate. Evidence only, never a check threshold.
def pineVisual=layout.projectDirectory.dir(providers.gradleProperty('pineCrownsVisualDirectory').getOrElse('build/pine-crowns-evidence/visual-NEW'))
def pinePreset=providers.gradleProperty('pineCrownsVisualPreset').getOrElse('blockbranch:realistic')
def pineGate=providers.gradleProperty('pineCrownsVisualGate').getOrElse('any')
loom.runs.register('pineCrownsVisual'){
 client();runDir(pineVisual.asFile.absolutePath);vmArg('-Xms512m');vmArg('-Xmx3G')
 vmArg('-Dblockbranch.pineCrownsVisual=true');vmArg('-Dblockbranch.pineCrownsVisualPreset='+pinePreset);vmArg('-Dblockbranch.pineCrownsVisualGate='+pineGate)
 vmArg('-Dblockbranch.pineCrownsVisualDirectory='+pineVisual.asFile.absolutePath)
 programArgs('--username','PineView','--width','1024','--height','576')
}
tasks.register('preparePineCrownsVisual'){doLast{
 assert !pineVisual.file('options.txt').asFile.exists():'Retain native captures; choose a fresh directory.'
 pineVisual.asFile.mkdirs();pineVisual.file('options.txt').asFile.text='renderDistance:6\nsimulationDistance:5\nmaxFps:260\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n'
}}
tasks.named('runPineCrownsVisual'){dependsOn 'preparePineCrownsVisual';doLast{assert pineVisual.file('result.txt').asFile.text.startsWith('PASS')}}



// Native generated-chunk witnesses at two old-growth-pine windows and five controls (seed 1); see PineCrownsQualification for the modes.
// baseline276 uses the pine-gate-absent baseline preset (schema 276, the bundled preset before schema 277); fresh277 uses the bundled preset.
def pineDir=layout.projectDirectory.dir(providers.gradleProperty('pineCrownsDirectory').getOrElse('build/pine-crowns-native'))
def pineMode=providers.gradleProperty('pineCrownsMode').getOrElse('fresh277')
def pineBaselineDigests=layout.projectDirectory.file(providers.gradleProperty('pineCrownsBaseline').getOrElse('build/pine-crowns-evidence/baseline276/baseline.txt')).asFile.absolutePath
loom.runs.register('pineCrownsQualification'){
 server();runDir(pineDir.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
 vmArg('-Dblockbranch.pineCrownsMode='+pineMode);vmArg('-Dblockbranch.pineCrownsDirectory='+pineDir.asFile.absolutePath);vmArg('-Dblockbranch.pineCrownsBaseline='+pineBaselineDigests)
}
tasks.register('preparePineCrownsQualification'){doLast{
 assert pineMode in ['baseline276','fresh277','verify277','legacy276']:'Unknown pineCrownsMode '+pineMode
 pineDir.file('result.txt').asFile.delete()
 if(pineMode in ['baseline276','fresh277'])assert !pineDir.file('server.properties').asFile.exists():'Retain the recorded world; choose a fresh directory.'
 else assert pineDir.file('survey/level.dat').asFile.exists():'Requires the actual closed world.'
 pineDir.asFile.mkdirs();pineDir.file('eula.txt').asFile.text='eula=true\n'
 pineDir.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25646\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type='+(pineMode=='baseline276'?'blockbranch:pine_crowns_baseline':'blockbranch:realistic')+'\nlevel-seed=1\nmax-tick-time=0\n'
}}
tasks.named('runPineCrownsQualification'){dependsOn 'preparePineCrownsQualification';doLast{assert pineDir.file('result.txt').asFile.text.startsWith('PASS')}}
