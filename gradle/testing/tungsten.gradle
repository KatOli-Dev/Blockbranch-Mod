def steelReaderRoot=file('src/integrationTest/resources/blockbranch-fixtures/metallurgy-v5')
def steelReaderOrigin=new File(steelReaderRoot,'ORIGIN.json')
def steelReaderFiles=['cubic/ColumnWorldFormat.java','realistic/OreLayer.java','metallurgy/TinVeins.java','metallurgy/ZincVeins.java','metallurgy/ManganeseVeins.java'].collect{new File(steelReaderRoot,'blockbranch/'+it)}
def steelReaderClasses=layout.buildDirectory.dir('historical-metallurgy-v5')
def steelReaderCompile=tasks.register('compileLegacySteelCatalog',JavaCompile){
 dependsOn tasks.named('compileJava');source(steelReaderFiles);inputs.file(steelReaderOrigin)
 classpath=sourceSets.main.compileClasspath+sourceSets.main.output;destinationDirectory.set(steelReaderClasses)
 javaCompiler.set(javaToolchains.compilerFor{languageVersion.set(JavaLanguageVersion.of(25))});options.release.set(25);options.compilerArgs.add('-proc:none')
 doFirst{def origin=new groovy.json.JsonSlurper().parse(steelReaderOrigin);for(def row:origin.sources){def input=new File(steelReaderRoot,'blockbranch/'+row.path.substring('src/main/java/blockbranch/'.length()));assert java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()==row.sha256:'Frozen metallurgy-v5 input changed'}}
}
loom.runs.named('metallurgySmoke'){vmArg('-Dblockbranch.oldSteelCatalogClasses='+steelReaderClasses.get().asFile.absolutePath)}
tasks.named('runMetallurgySmoke'){dependsOn steelReaderCompile}
if(providers.gradleProperty('tungstenView').isPresent()){
 loom.runs.named('metallurgyViewServer'){vmArg('-Dblockbranch.tungstenView=true')}
 loom.runs.named('metallurgyViewClient'){vmArg('-Dblockbranch.tungstenView=true')}
}
def tungstenResources=layout.projectDirectory.dir('src/main/resources').asFile
def tungstenItems=['tungsten_ore','deepslate_tungsten_ore','raw_tungsten','tungsten_ingot','tungsten_steel_ingot']+['pickaxe','axe','shovel','hoe'].collect{'tungsten_steel_'+it}
def tungstenRecipes=['tungsten_steel_ingot']+['pickaxe','axe','shovel','hoe'].collect{'tungsten_steel_'+it}+['raw_tungsten','tungsten_ore','deepslate_tungsten_ore'].collectMany{s->['smelting','blasting'].collect{'tungsten_ingot_from_'+it+'_'+s}}
def tungstenSprites=['block/tungsten_ore_overlay','item/raw_tungsten','item/tungsten_ingot','item/tungsten_steel_ingot']+['pickaxe','axe','shovel','hoe'].collect{'item/tungsten_steel_'+it}
tasks.register('verifyTungstenResources'){
 inputs.files(fileTree(tungstenResources){include '**/*tungsten*','**/*tungsten*/**','**/lang/en_us.json','**/tags/item/*.json','**/tags/block/needs_diamond_tool.json','**/tags/block/mineable/pickaxe.json'})
 doLast{
  def read={String path->new groovy.json.JsonSlurper().parse(new File(tungstenResources,path))}
  for(def sprite:tungstenSprites){def image=javax.imageio.ImageIO.read(new File(tungstenResources,'assets/blockbranch/textures/'+sprite+'.png'));assert image.width==16&&image.height==16:'Keep tungsten pixel art 16x';int clear=0,solid=0;for(int y=0;y<16;y++)for(int x=0;x<16;x++){int a=image.getRGB(x,y)>>>24;if(a==0)clear++;if(a==255)solid++};assert clear>0&&solid>0:'Original sprites retain silhouette/host transparency'}
  for(def row:[['tungsten_ore','stone'],['deepslate_tungsten_ore','deepslate']]){def m=read('assets/blockbranch/models/block/'+row[0]+'.json');assert m.parent=='blockbranch:block/composited_ore'&&m.textures.base=='minecraft:block/'+row[1]&&m.textures.overlay=='blockbranch:block/tungsten_ore_overlay':'Keep native resource-pack host compositing';assert read('assets/blockbranch/blockstates/'+row[0]+'.json').variants[''].model=='blockbranch:block/'+row[0];assert read('data/blockbranch/loot_table/blocks/'+row[0]+'.json').type=='minecraft:block'}
  def names=read('assets/blockbranch/lang/en_us.json');for(def name:tungstenItems){def m=read('assets/blockbranch/items/'+name+'.json').model;assert m.type=='minecraft:model'&&m.model=='blockbranch:item/'+name;assert read('assets/blockbranch/models/item/'+name+'.json');assert names[(name in tungstenItems.take(2)?'block.':'item.')+'blockbranch.'+name]}
  for(def tag:['mineable/pickaxe','needs_diamond_tool']){def t=read('data/minecraft/tags/block/'+tag+'.json');assert t.replace==false&&tungstenItems.take(2).every{t.values.contains('blockbranch:'+it)}}
  for(def row:[['pickaxe','pickaxes'],['axe','axes'],['shovel','shovels'],['hoe','hoes']]){def t=read('data/minecraft/tags/item/'+row[1]+'.json');assert t.replace==false&&t.values.contains('blockbranch:tungsten_steel_'+row[0])}
  assert read('data/blockbranch/tags/item/tungsten_steel_repair_materials.json').values==['blockbranch:tungsten_steel_ingot']
  for(def name:tungstenRecipes){def recipe=read('data/blockbranch/recipe/'+name+'.json');assert recipe.result.id.startsWith('blockbranch:');def unlock=read('data/blockbranch/advancement/recipes/metallurgy/'+name+'.json');assert unlock.criteria.has_the_recipe.conditions.recipes=='blockbranch:'+name&&unlock.rewards.recipes==['blockbranch:'+name];assert unlock.requirements.flatten().toSet()==unlock.criteria.keySet()}
  println 'PASS tungsten: nine items, eight original 16x sprites, native-host compositing, diamond gates and eleven recipe/unlock pairs'
 }
}
tasks.named('check'){dependsOn tasks.named('verifyTungstenResources')}
