import groovy.json.JsonSlurper
import java.security.MessageDigest

def fixture=layout.projectDirectory.dir('src/integrationTest/resources/blockbranch-fixtures/surface-ownership-reader-257')
def readerClasses=layout.buildDirectory.dir('surface-ownership-reader-257')
def runtimeReader=layout.buildDirectory.dir('surface-ownership-reader-runtime')
def readerFiles=fileTree(readerClasses).matching {include '**/*.class'}
def snapshotCollector=layout.projectDirectory.file('src/integrationTest/java/blockbranch/realistic/PublishedSurfaceSnapshot.java')
tasks.register('verifySurfaceOwnershipReader') {
    inputs.dir(fixture);inputs.file(snapshotCollector)
    doLast {
        def origin=new JsonSlurper().parse(fixture.file('ORIGIN.json').asFile)
        assert origin.repository=='KatOli-Dev/Blockbranch-Mod' && origin.commit=='a41e39a00d4347a5a96773cfbb60fc3a7c038c70'
        assert origin.sources*.path.toSet()==['src/main/java/blockbranch/realistic/RealisticGenerator.java','src/main/java/blockbranch/realistic/ScreeBiomeSource.java'].toSet()
        origin.sources.each { row ->
            def bytes=fixture.file(row.path.substring('src/main/java/'.length())).asFile.bytes
            assert MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()==row.sha256:'Frozen surface reader changed: '+row.path
        }
        assert MessageDigest.getInstance('SHA-256').digest(fixture.file(origin.baseline.path).asFile.bytes).encodeHex().toString()==origin.baseline.sha256:'Frozen independent published output changed'
        assert MessageDigest.getInstance('SHA-256').digest(snapshotCollector.asFile.bytes).encodeHex().toString()==origin.baseline.collectorSha256:'Snapshot collector changed; review its independent recording provenance'
    }
}
tasks.register('compileSurfaceOwnershipReader',JavaCompile) {
    dependsOn 'classes','verifySurfaceOwnershipReader'
    source fixture.asFile;include '**/*.java'
    classpath=sourceSets.main.output+sourceSets.main.compileClasspath
    destinationDirectory=readerClasses
    javaCompiler=javaToolchains.compilerFor { languageVersion=JavaLanguageVersion.of(25) }
    options.release=25;options.compilerArgs.add('-proc:none')
}
tasks.named('checkHistoricalReaderFixtures'){dependsOn 'verifySurfaceOwnershipReader'}

// Preserve source bytes and algorithms. Rename only the two compiled class-name
// prefixes so the original reader can use package-private production helpers in
// the same loader/package. An isolated child loader does not have that access.
tasks.register('relocateSurfaceOwnershipReader') {
    dependsOn 'compileSurfaceOwnershipReader'
    inputs.dir(readerClasses);outputs.dir(runtimeReader)
    doLast {
        readerFiles.files.each { inputFile ->
            def buffer=new ByteArrayOutputStream()
            inputFile.withDataInputStream { input ->
                def output=new DataOutputStream(buffer)
                output.writeInt(input.readInt());output.writeShort(input.readUnsignedShort());output.writeShort(input.readUnsignedShort())
                int count=input.readUnsignedShort();output.writeShort(count)
                for(int i=1;i<count;i++) {
                    int tag=input.readUnsignedByte();output.writeByte(tag)
                    if(tag==1)output.writeUTF(input.readUTF().replace('blockbranch/realistic/RealisticGenerator','blockbranch/realistic/Published257RealisticGenerator').replace('blockbranch/realistic/ScreeBiomeSource','blockbranch/realistic/Published257ScreeBiomeSource'))
                    else {
                        int length=tag in [3,4,9,10,11,12,17,18]?4:tag in [5,6]?8:tag in [7,8,16,19,20]?2:tag==15?3:-1
                        assert length>0:'Unexpected constant-pool tag '+tag
                        output.write(input.readNBytes(length));if(tag in [5,6])i++
                    }
                }
                output.write(input.readAllBytes());output.flush()
            }
            def relative=readerClasses.get().asFile.toPath().relativize(inputFile.toPath()).toString().replace('RealisticGenerator','Published257RealisticGenerator').replace('ScreeBiomeSource','Published257ScreeBiomeSource')
            def target=runtimeReader.get().file(relative).asFile;target.parentFile.mkdirs();target.bytes=buffer.toByteArray()
        }
    }
}
sourceSets.integrationTest.output.dir([builtBy:'relocateSurfaceOwnershipReader'],runtimeReader)

def dir=layout.projectDirectory.dir(providers.gradleProperty('ownershipDirectory').getOrElse('build/surface-ownership-native'))
def reopen=providers.gradleProperty('ownershipReopen').isPresent()
def legacy=providers.gradleProperty('ownershipLegacy').isPresent()
def resultName=(reopen?'reopen-':'')+'result.txt'
loom.runs.register('surfaceOwnershipQualification') {
    server();runDir(dir.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
    vmArg('-Dblockbranch.surfaceOwnershipQualification=true')
    vmArg('-Dblockbranch.surfaceOwnershipResult='+dir.file(resultName).asFile.absolutePath)
    vmArg('-Dblockbranch.surfaceOwnershipReader='+readerClasses.get().asFile.absolutePath)
    vmArg('-Dblockbranch.surfaceOwnershipReopen='+reopen)
    vmArg('-Dblockbranch.surfaceOwnershipLegacy='+legacy)
}
tasks.register('prepareSurfaceOwnershipQualification') { doLast {
    assert !dir.file(resultName).asFile.exists():'Preserve earlier qualification results; select a fresh directory or reopen phase.'
    if(legacy||reopen)assert dir.file('survey/level.dat').asFile.exists():'Requires a copied closed actual world; never synthesize old metadata.'
    else assert !dir.file('server.properties').asFile.exists():'Use a fresh directory.'
    dir.asFile.mkdirs();dir.file('eula.txt').asFile.text='eula=true\n'
    dir.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25616\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed=424242\nmax-tick-time=0\n'
} }
tasks.named('runSurfaceOwnershipQualification') {
    dependsOn 'prepareSurfaceOwnershipQualification','relocateSurfaceOwnershipReader'
    doLast {assert dir.file(resultName).asFile.text.startsWith('PASS')}
}

def visualDir=layout.projectDirectory.dir(providers.gradleProperty('ownershipVisualDirectory').getOrElse('build/surface-ownership-visual'))
loom.runs.register('surfaceOwnershipVisual') {
    client();runDir(visualDir.asFile.absolutePath);vmArg('-Xmx3G')
    vmArg('-Dblockbranch.surfaceOwnershipVisual=true')
    vmArg('-Dblockbranch.surfaceOwnershipVisualDirectory='+visualDir.asFile.absolutePath)
    programArgs('--username','OwnershipView','--width','1024','--height','576')
}
tasks.register('prepareSurfaceOwnershipVisual'){doLast{
    assert !visualDir.file('options.txt').asFile.exists():'Preserve previous captures; select a fresh ownershipVisualDirectory.'
    visualDir.asFile.mkdirs()
    visualDir.file('options.txt').asFile.text='renderDistance:10\nsimulationDistance:5\nmaxFps:30\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n'
}}
tasks.named('runSurfaceOwnershipVisual') {
    dependsOn 'prepareSurfaceOwnershipVisual'
    doLast{assert visualDir.file('result.txt').asFile.text.startsWith('PASS')}
}
