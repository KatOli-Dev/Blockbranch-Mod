// Optional finite diagnosis; no generation changes or Python dependency.
tasks.register('assessFloodplain',JavaExec){
 dependsOn 'compileIntegrationTestJava';classpath=sourceSets.integrationTest.runtimeClasspath
 mainClass='blockbranch.realistic.FloodplainAssessment';maxHeapSize='3G'
 args(providers.gradleProperty('floodplainAssessmentReport').getOrElse('build/floodplain-evidence/assessment269.json'))
}

def original=layout.projectDirectory.dir(providers.gradleProperty('published269Directory').getOrElse('build/floodplain-evidence/published269'))
def originalSeed=providers.gradleProperty('published269Seed').getOrElse('424242')
def originalReopen=providers.gradleProperty('published269Reopen').isPresent()
loom.runs.register('published269Snapshot'){
 server();runDir(original.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
 vmArg('-Dblockbranch.published269Diagnostic='+providers.gradleProperty('published269Diagnostic').isPresent());vmArg('-Dblockbranch.published269Snapshot=true');vmArg('-Dblockbranch.published269Reopen='+originalReopen)
 vmArg('-Dblockbranch.published269SnapshotResult='+original.file(originalReopen?'reopen-result.txt':'result.txt').asFile.absolutePath)
}
tasks.register('preparePublished269Snapshot'){doLast{
 if(originalReopen)assert original.file('survey/level.dat').asFile.exists():'Requires an authentic closed269 world.'
 else assert !original.file('server.properties').asFile.exists():'Preserve evidence; choose a fresh directory.'
 original.asFile.mkdirs();original.file('eula.txt').asFile.text='eula=true\n'
 original.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25627\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed='+originalSeed+'\nmax-tick-time=0\n'
}}
tasks.named('runPublished269Snapshot'){dependsOn 'preparePublished269Snapshot';doLast{assert original.file(originalReopen?'reopen-result.txt':'result.txt').asFile.text.startsWith('PASS')}}


tasks.register('checkAlluvial',JavaExec){dependsOn 'testClasses';classpath=sourceSets.test.runtimeClasspath;mainClass='blockbranch.realistic.AlluvialCheck';maxHeapSize='1G'}
tasks.named('check'){dependsOn 'checkAlluvial'}
tasks.register('surveyAlluvialDesign',JavaExec){
 dependsOn 'compileIntegrationTestJava';classpath=sourceSets.integrationTest.runtimeClasspath;mainClass='blockbranch.realistic.AlluvialDesignSurvey';maxHeapSize='3G'
 args(providers.gradleProperty('alluvialSectionInput').getOrElse('build/floodplain-evidence/assessment269-sections.json'),providers.gradleProperty('alluvialDesignReport').getOrElse('build/floodplain-evidence/design270.json'))
}

def alluvialFixture=layout.projectDirectory.dir('src/integrationTest/resources/blockbranch-fixtures/alluvial-reader-269')
def alluvialRoot=layout.projectDirectory
def alluvialCollectors=['src/integrationTest/java/blockbranch/realistic/Published269Snapshot.java','src/integrationTest/java/blockbranch/realistic/Published269CoverAudit.java','src/integrationTest/java/blockbranch/mixin/qa/AdmissionWorkMixin.java'].collect{alluvialRoot.file(it)}
tasks.register('verifyAlluvialReader'){
 inputs.dir(alluvialFixture);inputs.files(alluvialCollectors);inputs.file(alluvialRoot.file("src/integrationTest/resources/data/blockbranch/worldgen/world_preset/alluvial_baseline.json"))
 doLast{
  def origin=new groovy.json.JsonSlurper().parse(alluvialFixture.file('ORIGIN.json').asFile)
  def hash={f->java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
  assert origin.commit=='a7bea44a4a10baea5ab57559444807789f64b4cc'
  origin.collectors.each{assert hash(alluvialRoot.file(it.path).asFile)==it.sha256}
  origin.fixtures.each{assert hash(alluvialFixture.file(it.path).asFile)==it.sha256}
  assert hash(alluvialRoot.file(origin.preset.path).asFile)==origin.preset.sha256
 }
}
tasks.named('checkHistoricalReaderFixtures'){dependsOn 'verifyAlluvialReader'}
tasks.named('runPublished269Snapshot'){doFirst{
 if(originalReopen)assert original.file('baseline.json').asFile.bytes==alluvialFixture.file('baseline-'+originalSeed+'.json').asFile.bytes:'Requires frozen original269 native subset.'
}}
