}

def nativeDir=layout.projectDirectory.dir(providers.gradleProperty('alluvialDirectory').getOrElse('build/floodplain-evidence/native-seed1'))
def nativeSeed=providers.gradleProperty('alluvialSeed').getOrElse('1')
def nativeReopen=providers.gradleProperty('alluvialReopen').isPresent()
loom.runs.register('alluvialQualification'){
 server();runDir(nativeDir.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
 vmArg('-Dblockbranch.alluvialQualification=true');vmArg('-Dblockbranch.alluvialSeed='+nativeSeed);vmArg('-Dblockbranch.alluvialReopen='+nativeReopen)
 vmArg('-Dblockbranch.alluvialResult='+nativeDir.file(nativeReopen?'reopen-result.txt':'result.txt').asFile.absolutePath)
 vmArg('-Dblockbranch.alluvialLegacyAudit='+layout.projectDirectory.file(providers.gradleProperty('alluvialLegacyAudit').getOrElse('build/floodplain-evidence/legacy269-seed'+nativeSeed+'/reopen-cover-audit.json')).asFile.absolutePath)
 vmArg('-Dblockbranch.alluvialDesignInput='+layout.projectDirectory.file(providers.gradleProperty('alluvialDesignInput').getOrElse('build/floodplain-evidence/design270-strict-stages.json')).asFile.absolutePath)
 vmArg('-Dblockbranch.alluvialSectionInput='+layout.projectDirectory.file(providers.gradleProperty('alluvialSectionInput').getOrElse('build/floodplain-evidence/assessment269-sections.json')).asFile.absolutePath)
}
tasks.register('prepareAlluvialQualification'){doLast{
 if(nativeReopen)assert nativeDir.file('survey/level.dat').asFile.exists():'Requires closed candidate world.'
 else assert !nativeDir.file('server.properties').asFile.exists():'Preserve evidence; choose a fresh directory.'
 nativeDir.asFile.mkdirs();nativeDir.file('eula.txt').asFile.text='eula=true\n'
 nativeDir.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25627\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed='+nativeSeed+'\nmax-tick-time=0\n'
}}
tasks.named('runAlluvialQualification'){dependsOn 'prepareAlluvialQualification';doLast{assert nativeDir.file(nativeReopen?'reopen-result.txt':'result.txt').asFile.text.startsWith('PASS')}}

