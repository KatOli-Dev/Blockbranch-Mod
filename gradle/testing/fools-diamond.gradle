  def client=foolsRoot.dir(foolsOverride?'retexture':'base');for(def n:['stone-close','deep-close'])client.file('screenshots/'+(foolsOverride?'retexture':'base')+'-'+n+'.png').asFile.delete()
  if(foolsOverride){def pack=client.dir('resourcepacks/tin-host-test');for(def row:[['diamond_ore',0xb86b44,0xe3ab67],['deepslate_diamond_ore',0x416e55,0x78a77b]]){def target=pack.file('assets/minecraft/textures/block/'+row[0]+'.png').asFile;target.parentFile.mkdirs();def image=new java.awt.image.BufferedImage(16,16,java.awt.image.BufferedImage.TYPE_INT_ARGB);for(int y=0;y<16;y++)for(int x=0;x<16;x++)image.setRGB(x,y,(int)(0xff000000L|(((x/4+y/4)%2==0)?row[1]:row[2])));javax.imageio.ImageIO.write(image,'png',target)}}
 }
}
