// Finite leaf-litter measurements and ground-level captures; evidence only, never a check threshold.
def audit=layout.projectDirectory.dir(providers.gradleProperty('leafLitterDirectory').getOrElse('build/leaf-litter-evidence/audit-NEW'))
loom.runs.register('leafLitterAudit') {
 server();runDir(audit.asFile.absolutePath);vmArg('-Xms512m');vmArg('-Xmx3G');programArg('--nogui')
 vmArg('-Dblockbranch.leafLitterAudit=true');vmArg('-Dblockbranch.leafLitterDirectory='+audit.asFile.absolutePath)
}
tasks.register('prepareLeafLitterAudit'){doLast{
 assert !audit.file('server.properties').asFile.exists():'Retain measurements; choose a fresh directory.'
 audit.asFile.mkdirs();audit.file('eula.txt').asFile.text='eula=true\n'
 audit.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25624\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed=424242\nmax-tick-time=0\n'
}}
tasks.named('runLeafLitterAudit'){dependsOn 'prepareLeafLitterAudit';doLast{assert audit.file('result.txt').asFile.text.startsWith('PASS')}}

def visual=layout.projectDirectory.dir(providers.gradleProperty('leafLitterVisualDirectory').getOrElse('build/leaf-litter-evidence/visual-NEW'))
loom.runs.register('leafLitterVisual') {
 client();runDir(visual.asFile.absolutePath);vmArg('-Xms512m');vmArg('-Xmx3G')
 vmArg('-Dblockbranch.leafLitterVisual=true');vmArg('-Dblockbranch.leafLitterVisualDirectory='+visual.asFile.absolutePath)
 vmArg('-Dblockbranch.leafLitterVisualReopen='+providers.gradleProperty('leafLitterVisualReopen').isPresent())
 programArgs('--username','LitterView','--width','1024','--height','576')
}
tasks.register('prepareLeafLitterVisual'){doLast{
 assert !visual.file('options.txt').asFile.exists():'Retain native captures; choose a fresh directory.'
 visual.asFile.mkdirs();visual.file('options.txt').asFile.text='renderDistance:6\nsimulationDistance:5\nmaxFps:260\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n'
}}
tasks.named('runLeafLitterVisual'){dependsOn 'prepareLeafLitterVisual';doLast{assert visual.file(providers.gradleProperty('leafLitterVisualReopen').isPresent()?'reopen-result.txt':'result.txt').asFile.text.startsWith('PASS')}}

tasks.register('checkLeafLitter',JavaExec){dependsOn 'testClasses';classpath=sourceSets.test.runtimeClasspath;mainClass='blockbranch.realistic.LeafLitterCheck';maxHeapSize='2G'}
tasks.named('check'){dependsOn 'checkLeafLitter'}
