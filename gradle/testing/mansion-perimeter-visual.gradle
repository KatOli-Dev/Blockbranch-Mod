// Opt-in disposable native mansion scenes; no ordinary runtime or production archive dependency.
def mansionDir=layout.projectDirectory.dir(providers.gradleProperty('mansionPerimeterVisualDirectory').getOrElse('build/mansion-perimeter-visuals/native'))
def mansionReopen=providers.gradleProperty('mansionPerimeterVisualReopen').getOrElse('false')=='true'
loom.runs.register('mansionPerimeterVisual'){
 client();runDir(mansionDir.asFile.absolutePath);vmArg('-Xms512m');vmArg('-Xmx3G')
 vmArg('-Dblockbranch.mansionPerimeterVisual=true');vmArg('-Dblockbranch.mansionPerimeterVisualDirectory='+mansionDir.asFile.absolutePath)
 vmArg('-Dblockbranch.mansionPerimeterVisualReopen='+mansionReopen)
 vmArg('-Dblockbranch.mansionPerimeterVisualBaseline='+providers.gradleProperty('mansionPerimeterVisualBaseline').getOrElse('false'))
 vmArg('-Dblockbranch.mansionPerimeterVisualPriorJar='+providers.gradleProperty('mansionPerimeterVisualPriorJar').getOrElse(''))
 vmArg('-Dblockbranch.mansionPerimeterVisualCurrentJar='+providers.gradleProperty('mansionPerimeterVisualCurrentJar').getOrElse(''))
 vmArg('-Dblockbranch.mansionPerimeterVisualPriorReference='+providers.gradleProperty('mansionPerimeterVisualPriorReference').getOrElse(providers.gradleProperty('mansionPerimeterVisualReference').getOrElse('')))
 vmArg('-Dblockbranch.mansionPerimeterVisualReference='+providers.gradleProperty('mansionPerimeterVisualReference').getOrElse(''))
 vmArg('-Dblockbranch.mansionVisualBaseline='+providers.gradleProperty('mansionPerimeterVisualBaseline').getOrElse('false'))
 vmArg('-Dblockbranch.mansionVisualReopen='+mansionReopen)
 programArgs('--username','MansionPerim','--width','1024','--height','576')
}
tasks.register('prepareMansionPerimeterVisual'){doLast{
 mansionDir.asFile.mkdirs()
 assert mansionDir.dir('saves/MansionPerimeterVisualReview').asFile.exists()==mansionReopen:'Use a fresh directory or explicitly reopen.'
 assert !mansionDir.file(mansionReopen?'reopen-result.txt':'result.txt').asFile.exists():'Preserve prior evidence.'
 mansionDir.file('options.txt').asFile.text='renderDistance:10\nsimulationDistance:5\nmaxFps:30\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_music:0.0\n'
}}
tasks.named('runMansionPerimeterVisual'){dependsOn 'prepareMansionPerimeterVisual';doLast{assert mansionDir.file(mansionReopen?'reopen-result.txt':'result.txt').asFile.text.startsWith('PASS')}}
