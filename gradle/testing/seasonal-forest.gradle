def nativeDir=layout.projectDirectory.dir(providers.gradleProperty('seasonalForestDirectory').getOrElse('build/seasonal-forest-evidence/native'))
def nativeSeed=providers.gradleProperty('seasonalForestSeed').getOrElse('424242')
def nativeReopen=providers.gradleProperty('seasonalForestReopen').isPresent()
loom.runs.register('seasonalForestQualification'){
 server();runDir(nativeDir.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
 vmArg('-Dblockbranch.seasonalForestQualification=true');vmArg('-Dblockbranch.seasonalForestSeed='+nativeSeed);vmArg('-Dblockbranch.seasonalForestReopen='+nativeReopen)
 vmArg('-Dblockbranch.seasonalForestResult='+nativeDir.file(nativeReopen?'reopen-result.txt':'result.txt').asFile.absolutePath)
}
tasks.register('prepareSeasonalForestQualification'){doLast{
 if(nativeReopen)assert nativeDir.file('survey/level.dat').asFile.exists():'Requires closed candidate world.'
 else assert !nativeDir.file('server.properties').asFile.exists():'Preserve evidence; choose a fresh directory.'
 nativeDir.asFile.mkdirs();nativeDir.file('eula.txt').asFile.text='eula=true\n'
 nativeDir.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25627\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed='+nativeSeed+'\nmax-tick-time=0\n'
}}
tasks.named('runSeasonalForestQualification'){dependsOn 'prepareSeasonalForestQualification';doLast{assert nativeDir.file(nativeReopen?'reopen-result.txt':'result.txt').asFile.text.startsWith('PASS')}}

