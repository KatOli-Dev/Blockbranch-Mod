def comparison=layout.projectDirectory.dir(providers.gradleProperty('existingBiomeComparisonDirectory').getOrElse('build/montane-forest-evidence/existing-comparison'))
def comparisonWorld=layout.projectDirectory.dir(providers.gradleProperty('existingBiomeComparisonWorld').getOrElse('build/montane-forest-evidence/visual270-reviewed/saves/MontaneForestVisualReview'))
def comparisonViews=layout.projectDirectory.file(providers.gradleProperty('existingBiomeComparisonViews').getOrElse('build/montane-forest-evidence/visual270-reviewed/views.json'))
loom.runs.register('existingBiomeComparison'){
 server();runDir(comparison.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
 vmArg('-Dblockbranch.existingBiomeComparison=true');vmArg('-Dblockbranch.existingBiomeComparisonDirectory='+comparison.asFile.absolutePath)
 vmArg('-Dblockbranch.existingBiomeComparisonViews='+comparisonViews.asFile.absolutePath)
}
tasks.register('prepareExistingBiomeComparison'){doLast{
 assert !comparison.file('server.properties').asFile.exists():'Preserve dimension evidence; choose fresh directory.'
 assert comparisonWorld.file('level.dat').asFile.exists():'Requires the closed captured270 world.'
 def source=comparisonWorld.asFile.toPath(),target=comparison.dir('survey').asFile.toPath()
 java.nio.file.Files.walk(source).withCloseable{paths->paths.forEach{path->def dest=target.resolve(source.relativize(path));if(java.nio.file.Files.isDirectory(path))java.nio.file.Files.createDirectories(dest);else java.nio.file.Files.copy(path,dest)}}
 comparison.file('eula.txt').asFile.text='eula=true\n'
 comparison.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25627\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nmax-tick-time=0\n'
}}
tasks.named('runExistingBiomeComparison'){dependsOn 'prepareExistingBiomeComparison';doLast{assert comparison.file('result.txt').asFile.text.startsWith('PASS')}}

