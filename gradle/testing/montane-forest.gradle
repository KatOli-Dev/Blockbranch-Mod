// Optional finite source/model assessment; no production edits or Python.
tasks.register('assessMontaneForest',JavaExec){
 dependsOn 'compileIntegrationTestJava';classpath=sourceSets.integrationTest.runtimeClasspath;mainClass='blockbranch.realistic.MontaneForestAssessment';maxHeapSize='1G'
 args(providers.gradleProperty('montaneForestSurvey').getOrElse('build/conifer-assessment-evidence/current270/samples.csv'),providers.gradleProperty('montaneForestReport').getOrElse('build/conifer-assessment-evidence/montane-assessment.json'))
}

def original=layout.projectDirectory.dir(providers.gradleProperty('published270Directory').getOrElse('build/conifer-assessment-evidence/published270-seed1'))
def originalSeed=providers.gradleProperty('published270Seed').getOrElse('1')
def originalReopen=providers.gradleProperty('published270Reopen').isPresent()
loom.runs.register('published270Snapshot'){
 server();runDir(original.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
 vmArg('-Dblockbranch.published270Snapshot=true');vmArg('-Dblockbranch.published270Reopen='+originalReopen)
 vmArg('-Dblockbranch.published270Result='+original.file(originalReopen?'reopen-result.txt':'result.txt').asFile.absolutePath)
}
tasks.register('preparePublished270Snapshot'){doLast{
 if(originalReopen)assert original.file('survey/level.dat').asFile.exists():'Requires authentic closed270 world.'
 else assert !original.file('server.properties').asFile.exists():'Preserve evidence; choose a fresh directory.'
 original.asFile.mkdirs();original.file('eula.txt').asFile.text='eula=true\n'
 original.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25627\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed='+originalSeed+'\nmax-tick-time=0\n'
}}
tasks.named('runPublished270Snapshot'){dependsOn 'preparePublished270Snapshot';doLast{assert original.file(originalReopen?'reopen-result.txt':'result.txt').asFile.text.startsWith('PASS')}}

tasks.register('checkMontaneForest',JavaExec){
 dependsOn 'testClasses';classpath=sourceSets.test.runtimeClasspath
 mainClass='blockbranch.realistic.MontaneForestCheck';maxHeapSize='1G'
}
tasks.named('check'){dependsOn 'checkMontaneForest'}
def fixture=layout.projectDirectory.dir('src/integrationTest/resources/blockbranch-fixtures/montane-forest-reader-270')
def collector=layout.projectDirectory.file('src/integrationTest/java/blockbranch/realistic/Published270Snapshot.java')
def baselinePreset=layout.projectDirectory.file('src/integrationTest/resources/data/blockbranch/worldgen/world_preset/montane_forest_baseline.json')
tasks.register('verifyMontaneForestReader'){
 inputs.dir(fixture);inputs.file(collector);inputs.file(baselinePreset)
 doLast{
  def origin=new groovy.json.JsonSlurper().parse(fixture.file('ORIGIN.json').asFile)
  def hash={f->java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
  assert origin.commit=='833abc510ec3234ecf409d1a5e083d13a0e9e090'
  assert hash(collector.asFile)==origin.collectorSha256
  origin.compactObservables.each{assert hash(fixture.file(it.path).asFile)==it.sha256}
  assert hash(baselinePreset.asFile)==origin.costPresetSha256
 }
}
tasks.named('checkHistoricalReaderFixtures'){dependsOn 'verifyMontaneForestReader'}
tasks.named('runPublished270Snapshot'){doFirst{
 if(originalReopen){
  def origin=new groovy.json.JsonSlurper().parse(fixture.file('ORIGIN.json').asFile)
  def hash=java.security.MessageDigest.getInstance('SHA-256').digest(original.file('baseline.json').asFile.bytes).encodeHex().toString()
  assert hash==origin.baselines.find{it.seed.toString()==originalSeed}.sha256:'Requires frozen authentic original270 oracle.'
 }
}}

