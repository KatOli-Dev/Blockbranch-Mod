// A copied old PASS cannot certify a launch that exits before SERVER_STARTED.
tasks.named('preparePublished270Snapshot'){doLast{original.file(originalReopen?'reopen-result.txt':'result.txt').asFile.delete()}}
tasks.named('prepareMontaneForestQualification'){doLast{nativeDir.file(nativeReopen?'reopen-result.txt':'result.txt').asFile.delete()}}

