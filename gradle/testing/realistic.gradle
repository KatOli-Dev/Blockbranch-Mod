        directory.toPath().resolve('screenshots/open-inland-lake-underwater.png').toFile().delete()
        directory.toPath().resolve('screenshots/cold-dwarf-shrub-tundra.png').toFile().delete()
        directory.toPath().resolve('screenshots/inland-lake-reedbed.png').toFile().delete()
        directory.toPath().resolve('screenshots/gravel-bed-river-margin.png').toFile().delete()
        directory.toPath().resolve('screenshots/low-gradient-sandy-shore.png').toFile().delete()
        directory.toPath().resolve('screenshots/rolling-lowland-forb-grass-meadow.png').toFile().delete()
