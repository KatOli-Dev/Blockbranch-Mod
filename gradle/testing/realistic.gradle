// Matched horizon captures (see HorizonVisualReview); -PhorizonVisualDirectory selects a fresh build/ directory.
def horizonVisualDir=layout.projectDirectory.dir(providers.gradleProperty('horizonVisualDirectory').getOrElse('build/horizon-evidence/visual'))
loom.runs.register('horizonVisual'){
    client();runDir(horizonVisualDir.asFile.absolutePath);vmArg('-Xmx3G')
    vmArg('-Dblockbranch.horizon=true')
    vmArg('-Dblockbranch.horizonVisual=true')
    vmArg('-Dblockbranch.horizonVisualDirectory='+horizonVisualDir.asFile.absolutePath)
    // -PhorizonVisualViews=water reviews only the shoreline view; =structures a placed tower and the nearest planned surface structure; =wells the nearest atlas wells.
    providers.gradleProperty('horizonVisualViews').orNull?.with{vmArg('-Dblockbranch.horizonVisualViews='+it)}
    // -PhorizonVisualRadius narrows the horizon radius (default 2048 blocks), so a review of nearby structures settles sooner.
    providers.gradleProperty('horizonVisualRadius').orNull?.with{vmArg('-Dblockbranch.horizon.radius='+(it as int))}
    programArgs('--username','HorizonVisual','--width','1280','--height','720')
}
// -PhorizonVisualMaxFps caps the frame rate (260, the default, is unlimited), for timing runs, where uncapped rendering can compete with tile sampling for a laptop's CPU.
def horizonVisualMaxFps=providers.gradleProperty('horizonVisualMaxFps').getOrElse('260') as int
assert horizonVisualMaxFps>=10&&horizonVisualMaxFps<=260:'horizonVisualMaxFps must be 10-260'
tasks.register('prepareHorizonVisual'){doLast{
    horizonVisualDir.asFile.mkdirs()
    assert !horizonVisualDir.dir('saves/HorizonVisualReview').asFile.exists():'Preserve previous visual evidence; select a fresh directory.'
    // Clouds stay at their vanilla height, often below realistic terrain; they are off so captures compare terrain alone.
    horizonVisualDir.file('options.txt').asFile.text='renderDistance:6\nsimulationDistance:5\nmaxFps:'+horizonVisualMaxFps+'\ninactivityFpsLimit:"minimized"\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_master:0.0\nsoundCategory_music:0.0\nrenderClouds:\"false\"\n'
}}
tasks.named('runHorizonVisual'){dependsOn 'prepareHorizonVisual';environment('ALSOFT_DRIVERS','null');doLast{assert horizonVisualDir.file('result.txt').asFile.text.startsWith('PASS')}}
