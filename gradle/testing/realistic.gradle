// Compatibility alias; analytic checks continue to execute through their existing check* JavaExec tasks.
tasks.register('realisticCheckClasses') { dependsOn tasks.named('testClasses') }
tasks.register('compileRealisticCheckJava') { dependsOn tasks.named('compileTestJava') }
tasks.register('processRealisticCheckResources') { dependsOn tasks.named('processTestResources') }
sourceSets.test {
    java.setSrcDirs(['src/test/java'])
    compileClasspath = sourceSets.main.output + sourceSets.integrationTest.output
    // TerrainRelief uses the Minecraft-provided primitive-map library in analytic checks.
    runtimeClasspath = output + compileClasspath + sourceSets.main.compileClasspath.filter { it.name.startsWith("fastutil-") }
}
