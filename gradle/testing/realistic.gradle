        directory.toPath().resolve('screenshots/dappled-oak-birch-woodland.png').toFile().delete()
        directory.toPath().resolve('screenshots/dappled-oak-birch-canopy.png').toFile().delete()
        directory.toPath().resolve('screenshots/dry-continental-scrub-steppe.png').toFile().delete()
        directory.toPath().resolve('screenshots/boreal-spruce-birch-woodland.png').toFile().delete()
        directory.toPath().resolve('screenshots/boreal-spruce-birch-canopy.png').toFile().delete()
        directory.toPath().resolve('screenshots/warm-subhumid-oak-pine-woodland.png').toFile().delete()
        directory.toPath().resolve('screenshots/warm-subhumid-oak-pine-canopy.png').toFile().delete()
        directory.toPath().resolve('screenshots/cold-continental-fescue-steppe.png').toFile().delete()
        directory.toPath().resolve('screenshots/continental-gravel-desert.png').toFile().delete()
        directory.toPath().resolve('screenshots/moderate-slope-meadow-woodland.png').toFile().delete()
        directory.toPath().resolve('screenshots/humid-subtropical-oak-fern-woodland.png').toFile().delete()
        directory.toPath().resolve('screenshots/humid-subtropical-oak-fern-canopy.png').toFile().delete()
        directory.toPath().resolve('screenshots/woodland-ground-after.png').toFile().delete()
        directory.toPath().resolve('screenshots/woodland-canopy-after.png').toFile().delete()
