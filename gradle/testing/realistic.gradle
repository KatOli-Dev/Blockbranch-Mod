// Opens an isolated copy of a tested cave world for actual native image review.
def undergroundClientDirectory=layout.projectDirectory.dir(providers.gradleProperty('undergroundClientDirectory').getOrElse('build/underground-client-review'))
loom.runs.register('undergroundClient') {
    client();runDir(undergroundClientDirectory.asFile.absolutePath);vmArg('-Xmx3G')
    vmArg('-Dblockbranch.undergroundClientSmoke=true')
    vmArg('-Dblockbranch.undergroundClientResult='+undergroundClientDirectory.file('result.txt').asFile.absolutePath)
    programArgs('--username','CaveReview','--width','1024','--height','576')
}
tasks.register('prepareUndergroundClient') {
    doLast {
        undergroundClientDirectory.asFile.mkdirs();undergroundClientDirectory.file('result.txt').asFile.delete()
        undergroundClientDirectory.file('options.txt').asFile.text='renderDistance:4\nsimulationDistance:5\nmaxFps:30\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_music:0.0\n'
    }
}
tasks.named('runUndergroundClient') {
    dependsOn tasks.named('prepareUndergroundClient')
    doLast {assert undergroundClientDirectory.file('result.txt').asFile.text.startsWith('PASS')}
}

// Passive rendering verification through native Create World and saved-world UI.
def undergroundAutomaticDistance=providers.gradleProperty('undergroundRenderDistance').getOrElse('4').toInteger()
if(undergroundAutomaticDistance<4||undergroundAutomaticDistance>12)throw new GradleException('Bounded underground qualification uses render distances4..12')
def undergroundAutomaticDirectory=layout.projectDirectory.dir(providers.gradleProperty('undergroundAutomaticDirectory').getOrElse('build/underground-automatic-render'))
loom.runs.register('undergroundAutomatic') {
    client();runDir(undergroundAutomaticDirectory.asFile.absolutePath);vmArg('-Xmx3G')
    vmArg('-Dblockbranch.undergroundAutomaticSmoke=true')
    vmArg('-Dblockbranch.undergroundAutomaticSeed='+providers.gradleProperty('undergroundSeed').getOrElse('424242'))
    vmArg('-Dblockbranch.undergroundQualification='+providers.gradleProperty('undergroundQualification').getOrElse('false'))
    vmArg('-Dblockbranch.undergroundAutomaticReload='+providers.gradleProperty('undergroundAutomaticReload').getOrElse('false'))
    vmArg('-Dblockbranch.undergroundAutomaticResult='+undergroundAutomaticDirectory.file('result.txt').asFile.absolutePath)
    programArgs('--username','AutomaticCave','--width','1024','--height','576')
}
tasks.register('prepareUndergroundAutomatic') {
    doLast {
        undergroundAutomaticDirectory.asFile.mkdirs();undergroundAutomaticDirectory.file('result.txt').asFile.delete()
        undergroundAutomaticDirectory.file('options.txt').asFile.text='renderDistance:'+undergroundAutomaticDistance+'\nsimulationDistance:5\nmaxFps:30\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_music:0.0\n'
    }
}
tasks.named('runUndergroundAutomatic') {
    dependsOn tasks.named('prepareUndergroundAutomatic')
    doLast {assert undergroundAutomaticDirectory.file('result.txt').asFile.text.startsWith('PASS')}
}

// Passive static review of a copied tested entrance world, using normal renderer readiness.
def uniformSnapshotDirectory=layout.projectDirectory.dir('build/uniform-snapshot-smoke')
loom.runs.register('uniformSnapshotSmoke') {
    server();runDir(uniformSnapshotDirectory.asFile.absolutePath);vmArg('-Xmx1G')
    vmArg('-Dblockbranch.uniformSnapshotSmoke=true')
    vmArg('-Dblockbranch.uniformSnapshotResult='+uniformSnapshotDirectory.file('result.txt').asFile.absolutePath)
    programArg('--nogui')
}
tasks.register('prepareUniformSnapshotSmoke') {
    doLast {
        uniformSnapshotDirectory.asFile.mkdirs();uniformSnapshotDirectory.file('result.txt').asFile.delete()
        uniformSnapshotDirectory.file('eula.txt').asFile.text='eula=true\n'
        uniformSnapshotDirectory.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-type=minecraft:flat\nview-distance=2\nsimulation-distance=2\n'
    }
}
tasks.named('runUniformSnapshotSmoke') {
    dependsOn tasks.named('prepareUniformSnapshotSmoke')
    doLast {assert uniformSnapshotDirectory.file('result.txt').asFile.text.startsWith('PASS')}
}

def caveApproachClientDirectory=layout.projectDirectory.dir(providers.gradleProperty('caveApproachClientDirectory').getOrElse('build/cave-approach-client'))
loom.runs.register('caveApproachClient') {
    client();runDir(caveApproachClientDirectory.asFile.absolutePath);vmArg('-Xmx3G')
    vmArg('-Dblockbranch.caveApproachClientSmoke=true')
    if(providers.gradleProperty('baselineRetentionAudit').isPresent())vmArg('-Dblockbranch.baselineRetentionAudit=true')
    if(providers.gradleProperty('baselineFullViews').isPresent())vmArg('-Dblockbranch.baselineFullViews=true')
    if(providers.gradleProperty('baselineRetentionCycles').isPresent())vmArg('-Dblockbranch.baselineRetentionCycles='+providers.gradleProperty('baselineRetentionCycles').get())
    if(providers.gradleProperty('poseDiagnosticSmoke').isPresent())vmArg('-Dblockbranch.poseDiagnosticSmoke=true')
    if(providers.gradleProperty('sectionStateProbe').isPresent())vmArg('-Dblockbranch.sectionStateProbe='+providers.gradleProperty('sectionStateProbe').get())
    vmArg('-Dblockbranch.oreReview='+providers.gradleProperty('oreReview').getOrElse('false'))
    if(providers.gradleProperty('meshOnlySmoke').isPresent())vmArg('-Dblockbranch.meshOnlySmoke=true')
    if(providers.gradleProperty('packetOccupancySmoke').isPresent())vmArg('-Dblockbranch.packetOccupancySmoke=true')
    vmArg('-Dblockbranch.litCaveReview='+providers.gradleProperty('litCaveReview').getOrElse('false'))
    vmArg('-Dblockbranch.dripstoneReview='+providers.gradleProperty('dripstoneReview').getOrElse('false'))
    if(providers.gradleProperty('sectionCopiesSmoke').isPresent()){
        vmArg('-Dblockbranch.sectionCopiesSmoke=true')
        vmArg('-Dblockbranch.sectionCopiesRequireDripstone='+providers.gradleProperty('sectionCopiesRequireDripstone').getOrElse('false'))
        vmArg('-Dblockbranch.sectionCopiesSmokeResult='+caveApproachClientDirectory.file('copies-result.txt').asFile.absolutePath)
    }
    vmArg('-Dblockbranch.dripstoneTargets='+providers.gradleProperty('dripstoneTargets').getOrElse('0,0,0'))
    vmArg('-Dblockbranch.caveApproachPoints='+providers.gradleProperty('caveApproachPoints').getOrElse(''))
    vmArg('-Dblockbranch.caveEntryPoints='+providers.gradleProperty('caveEntryPoints').getOrElse(''))
    vmArg('-Dblockbranch.caveApproachClientResult='+caveApproachClientDirectory.file('result.txt').asFile.absolutePath)
    programArgs('--username','CaveReview','--width','1024','--height','576')
}
tasks.register('prepareCaveApproachClient') {
    doLast {
        caveApproachClientDirectory.asFile.mkdirs();caveApproachClientDirectory.file('result.txt').asFile.delete()
        caveApproachClientDirectory.file('options.txt').asFile.text='renderDistance:8\nsimulationDistance:5\nmaxFps:30\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_music:0.0\n'
    }
}
tasks.named('runCaveApproachClient') {
    dependsOn tasks.named('prepareCaveApproachClient')
    doLast {assert caveApproachClientDirectory.file('result.txt').asFile.text.startsWith('PASS')}
}

// This project uses assertion-bearing JavaExec programs, not framework-discovered test classes.
// `test` remains a standard entry point for the canonical analytic build checks.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

// Historical staged habitat baselines evaluated over current terrain. These do
// not execute the complete current selector and cannot measure current coverage.
// Preserve their frozen selectors/assertions; current inventory uses runCurrentBiomeSurvey.
['checkBiomeCoverage','checkDeepOceanCoverage','checkHumidCoverage','checkLakeCoverage','checkMarineShelfCoverage','checkRiverChannelCoverage','checkTundraCoverage'].each { coverageName ->
    tasks.named(coverageName) {
        group='coverage verification'
        description='Manual historical habitat diagnostic over current terrain; not complete current biome coverage.'
    }
}

// Opt-in, fixed-grid current-selector survey with native final-biome spot checks.
// A fresh disposable world prevents saved palettes/settings from contaminating results.
def biomeSurveyDir=layout.projectDirectory.dir(providers.gradleProperty('biomeSurveyDirectory').getOrElse('build/biome-survey'))
loom.runs.register('currentBiomeSurvey') {
    server();runDir(biomeSurveyDir.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
    vmArg('-Dblockbranch.currentBiomeSurvey=true')
    vmArg('-Dblockbranch.currentBiomeSurveyDirectory='+biomeSurveyDir.asFile.absolutePath)
}
tasks.register('prepareCurrentBiomeSurvey') { doLast {
    assert !biomeSurveyDir.file('server.properties').asFile.exists():'Preserve previous evidence; select a fresh biomeSurveyDirectory.'
    biomeSurveyDir.asFile.mkdirs()
    biomeSurveyDir.file('eula.txt').asFile.text='eula=true\n'
    biomeSurveyDir.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25615\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed=424242\nmax-tick-time=0\n'
} }
tasks.named('runCurrentBiomeSurvey') {
    dependsOn 'prepareCurrentBiomeSurvey'
    doLast { assert biomeSurveyDir.file('result.txt').asFile.text.startsWith('PASS') }
}

