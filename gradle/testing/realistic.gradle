def smokeSeed=providers.gradleProperty('realisticSmokeSeed').getOrElse('424242')
def smokeDirectory = layout.projectDirectory.dir(providers.gradleProperty('realisticSmokeDirectory').getOrElse('build/deep-ocean-terrain-smoke'))
loom.runs.register('realisticSmoke') {
    server()
    name('Realistic terrain regression')
    runDir(smokeDirectory.asFile.absolutePath)
    vmArg('-Xmx2G')
    vmArg('-Dblockbranch.realisticSmoke=true')
    if(providers.gradleProperty('mapCommit').isPresent())vmArg('-Dblockbranch.mapCommit='+providers.gradleProperty('mapCommit').get())
    if(providers.gradleProperty('focusHabitat').isPresent())vmArg('-Dblockbranch.focusHabitat='+providers.gradleProperty('focusHabitat').get())
    if(providers.gradleProperty('caveBiomeTiming').isPresent())vmArg('-Dblockbranch.caveBiomeTiming=true')
    if(providers.gradleProperty('formationTiming').isPresent())vmArg('-Dblockbranch.formationTiming=true')
    if(providers.gradleProperty('litCaveTiming').isPresent())vmArg('-Dblockbranch.litCaveTiming=true')
    if(providers.gradleProperty('litCaveSectionsOnly').isPresent())vmArg('-Dblockbranch.litCaveSectionsOnly=true')
    if(providers.gradleProperty('litCaveRequireMoss').isPresent())vmArg('-Dblockbranch.litCaveRequireMoss=true')
    vmArg('-Dblockbranch.realisticSmokeResult=' + smokeDirectory.file('result.txt').asFile.absolutePath)
    programArg('--nogui')
}
def prepareSmoke = tasks.register('prepareRealisticSmoke') {
    doLast {
        def directory = smokeDirectory.asFile
        directory.mkdirs()
        directory.toPath().resolve('result.txt').toFile().delete()
        directory.toPath().resolve('eula.txt').toFile().text = 'eula=true\n'
        def properties = directory.toPath().resolve('server.properties').toFile()
        if (!properties.exists()) properties.text = '''online-mode=false
white-list=false
server-ip=127.0.0.1
server-port=25580
view-distance=2
simulation-distance=2
level-name=realistic
level-type=blockbranch:realistic
level-seed=424242
max-tick-time=2400000
'''.replace('level-seed=424242','level-seed='+smokeSeed)
        // The exhaustive habitat checks run in one startup callback, not normal gameplay ticks.
        // The full terrain comparison plus habitat tour exceeded20min. Keep a bounded40min
        // fixture-only budget; normal world/server properties are never touched.
        properties.text = properties.text.replaceAll('(?m)^max-tick-time=(120000|300000|600000|900000|1200000)$', 'max-tick-time=2400000')
    }
}
tasks.named('runRealisticSmoke') {
    dependsOn prepareSmoke
    doLast {
        def result = smokeDirectory.file('result.txt').asFile
        if (!result.exists() || result.text.trim() != 'PASS')
            throw new GradleException('Realistic terrain checks failed; inspect ' + smokeDirectory.asFile + '/logs/latest.log')
    }
}

