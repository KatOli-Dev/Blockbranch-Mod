// Horizon dedicated-server reconnect (see HorizonReconnectCheck): start runHorizonReconnectServer, wait for
// `Done`, then run runHorizonReconnectClient with the same fresh -PhorizonReconnectDirectory. Loopback only.
def horizonReconnectDir=layout.projectDirectory.dir(providers.gradleProperty('horizonReconnectDirectory').getOrElse('build/horizon-evidence/reconnect'))
def horizonReconnectPort=providers.gradleProperty('horizonReconnectPort').getOrElse('25614')
loom.runs.register('horizonReconnectServer'){
    server();runDir(horizonReconnectDir.asFile.absolutePath);vmArg('-Xmx2G');programArg('--nogui')
    vmArg('-Dblockbranch.horizon=true')
    vmArg('-Dblockbranch.horizonReconnect=true')
    vmArg('-Dblockbranch.horizonReconnectDirectory='+horizonReconnectDir.asFile.absolutePath)
}
loom.runs.register('horizonReconnectClient'){
    client();runDir(horizonReconnectDir.dir('client').asFile.absolutePath);vmArg('-Xmx3G')
    vmArg('-Dblockbranch.horizon=true')
    vmArg('-Dblockbranch.horizon.radius=1024')
    vmArg('-Dblockbranch.horizonReconnect=true')
    vmArg('-Dblockbranch.horizonReconnectDirectory='+horizonReconnectDir.asFile.absolutePath)
    vmArg('-Dblockbranch.horizonReconnectAddress=127.0.0.1:'+horizonReconnectPort)
    programArgs('--username','HorizonReconnect','--quickPlayMultiplayer','127.0.0.1:'+horizonReconnectPort,'--width','854','--height','480')
}
tasks.named('runHorizonReconnectServer'){doFirst{
    def dir=horizonReconnectDir.asFile;dir.mkdirs()
    assert !new File(dir,'world').exists()&&!new File(dir,'server.txt').exists():'Preserve previous reconnect evidence; select a fresh directory.'
    new File(dir,'eula.txt').text='eula=true\n'
    new File(dir,'server.properties').text='online-mode=false\nwhite-list=false\npause-when-empty-seconds=0\nserver-ip=127.0.0.1\nserver-port='+horizonReconnectPort+'\nlevel-name=world\nlevel-type=blockbranch:realistic\nlevel-seed=424242\nview-distance=6\nsimulation-distance=5\nmax-tick-time=600000\n'
};doLast{assert horizonReconnectDir.file('server.txt').asFile.text.startsWith('PASS')}}
tasks.named('runHorizonReconnectClient'){environment('ALSOFT_DRIVERS','null');doFirst{
    def dir=horizonReconnectDir.dir('client').asFile;dir.mkdirs()
    assert !horizonReconnectDir.file('result.txt').asFile.exists():'Preserve previous reconnect evidence; select a fresh directory.'
    new File(dir,'options.txt').text='renderDistance:6\nsimulationDistance:5\nmaxFps:30\ninactivityFpsLimit:"minimized"\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_master:0.0\nsoundCategory_music:0.0\nrenderClouds:\"false\"\n'
};doLast{assert horizonReconnectDir.file('result.txt').asFile.text.startsWith('PASS')}}
