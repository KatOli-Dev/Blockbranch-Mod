        if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Realistic client checks failed')
    }
}

def screeDirectory = layout.projectDirectory.dir('build/deep-ocean-scree-regression')
loom.runs.register('screeSmoke') {
    server()
    name('Alpine scree content and falling regression')
    runDir(screeDirectory.asFile.absolutePath)
    vmArg('-Xmx2G')
    vmArg('-Dblockbranch.screeSmoke=true')
    vmArg('-Dblockbranch.screeSmokeResult=' + screeDirectory.file('result.txt').asFile.absolutePath)
    programArg('--nogui')
}
def prepareScree = tasks.register('prepareScreeSmoke') {
    doLast {
        def directory = screeDirectory.asFile
        directory.mkdirs()
        directory.toPath().resolve('result.txt').toFile().delete()
        directory.toPath().resolve('eula.txt').toFile().text = 'eula=true\n'
        def properties = directory.toPath().resolve('server.properties').toFile()
        if (!properties.exists()) properties.text = '''online-mode=false
server-ip=127.0.0.1
server-port=25583
view-distance=2
simulation-distance=2
level-name=scree
level-type=blockbranch:realistic
level-seed=424242
max-tick-time=120000
'''
    }
}
tasks.named('runScreeSmoke') {
    dependsOn prepareScree
    doLast {
        def result = screeDirectory.file('result.txt').asFile
        if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Alpine scree checks failed; inspect ' + screeDirectory.asFile + '/logs/latest.log')
    }
}

