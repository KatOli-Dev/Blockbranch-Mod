def original=layout.projectDirectory.dir(providers.gradleProperty('published261Directory').getOrElse('build/published261-snapshot'))
loom.runs.register('published261Snapshot') {
    server();runDir(original.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
    vmArg('-Dblockbranch.published261Snapshot=true')
    vmArg('-Dblockbranch.published261SnapshotResult='+original.file('result.txt').asFile.absolutePath)
}
tasks.register('preparePublished261Snapshot'){doLast{
    assert !original.file('server.properties').asFile.exists():'Use a fresh directory; retain original evidence.'
    original.asFile.mkdirs();original.file('eula.txt').asFile.text='eula=true\n'
    original.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25620\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed=424242\nmax-tick-time=0\n'
}}
tasks.named('runPublished261Snapshot'){
    dependsOn 'preparePublished261Snapshot'
    doLast{assert original.file('result.txt').asFile.text.startsWith('PASS')}
}
tasks.register('assessDeepBasinRelief',JavaExec){dependsOn 'testClasses';classpath=sourceSets.test.runtimeClasspath;mainClass='blockbranch.realistic.DeepBasinAssessment';maxHeapSize='2G'}
tasks.register('checkDeepBasinRelief',JavaExec){dependsOn 'testClasses';classpath=sourceSets.test.runtimeClasspath;mainClass='blockbranch.realistic.DeepBasinReliefCheck';maxHeapSize='2G'}
tasks.named('check'){dependsOn 'checkDeepBasinRelief'}

// The original source is useful for codec/surface comparisons, but shares
// candidate helpers. Whole-original output hashes are the independent oracle.
def fixture=layout.projectDirectory.dir('src/integrationTest/resources/blockbranch-fixtures/deep-basin-reader-261')
def reader=layout.buildDirectory.dir('deep-basin-reader-261'),runtime=layout.buildDirectory.dir('deep-basin-reader-runtime')
def readerFiles=fileTree(reader).matching{include '**/*.class'}
def snapshotCollector=layout.projectDirectory.file('src/integrationTest/java/blockbranch/realistic/Published261Snapshot.java')
tasks.register('verifyDeepBasinReader'){
    inputs.dir(fixture);inputs.file(snapshotCollector)
    doLast{
        def origin=new groovy.json.JsonSlurper().parse(fixture.file('ORIGIN.json').asFile)
        assert origin.repository=='KatOli-Dev/Blockbranch-Mod'&&origin.commit=='2b35817d27e7c8444575653ecab6276b32c712f7'
        assert origin.sources*.path==['src/main/java/blockbranch/realistic/RealisticGenerator.java']
        def hash={f->java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
        origin.sources.each{assert hash(fixture.file(it.path.substring('src/main/java/'.length())).asFile)==it.sha256}
        assert hash(fixture.file(origin.baseline.path).asFile)==origin.baseline.sha256
        assert hash(snapshotCollector.asFile)==origin.baseline.collectorSha256
    }
}
tasks.named('checkHistoricalReaderFixtures'){dependsOn 'verifyDeepBasinReader'}
tasks.register('compileDeepBasinReader',JavaCompile){
    dependsOn 'classes','verifyDeepBasinReader';source fixture.asFile;include '**/*.java'
    classpath=sourceSets.main.output+sourceSets.main.compileClasspath;destinationDirectory=reader
    javaCompiler=javaToolchains.compilerFor{languageVersion=JavaLanguageVersion.of(25)}
    options.release=25;options.compilerArgs.add('-proc:none')
}
tasks.register('relocateDeepBasinReader'){
    dependsOn 'compileDeepBasinReader';inputs.dir(reader);outputs.dir(runtime)
    doLast{readerFiles.files.each{inputFile->
        def bytes=new ByteArrayOutputStream()
        inputFile.withDataInputStream{input->
            def output=new DataOutputStream(bytes);output.writeInt(input.readInt());output.writeShort(input.readUnsignedShort());output.writeShort(input.readUnsignedShort())
            int count=input.readUnsignedShort();output.writeShort(count)
            for(int i=1;i<count;i++){
                int tag=input.readUnsignedByte();output.writeByte(tag)
                if(tag==1)output.writeUTF(input.readUTF().replace('blockbranch/realistic/RealisticGenerator','blockbranch/realistic/Published261RealisticGenerator'))
                else{int length=tag in [3,4,9,10,11,12,17,18]?4:tag in [5,6]?8:tag in [7,8,16,19,20]?2:tag==15?3:-1;assert length>0;output.write(input.readNBytes(length));if(tag in [5,6])i++}
            }
            output.write(input.readAllBytes());output.flush()
        }
        def relative=reader.get().asFile.toPath().relativize(inputFile.toPath()).toString().replace('RealisticGenerator','Published261RealisticGenerator')
        def target=runtime.get().file(relative).asFile;target.parentFile.mkdirs();target.bytes=bytes.toByteArray()
    }}
}
sourceSets.integrationTest.output.dir([builtBy:'relocateDeepBasinReader'],runtime)

def dir=layout.projectDirectory.dir(providers.gradleProperty('deepBasinDirectory').getOrElse('build/deep-basin-native'))
def legacy=providers.gradleProperty('deepBasinLegacy').isPresent(),reopen=providers.gradleProperty('deepBasinReopen').isPresent()
def result=(reopen?'reopen-':'')+'result.txt'
loom.runs.register('deepBasinQualification'){
    server();runDir(dir.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
    vmArg('-Dblockbranch.deepBasinQualification=true');vmArg('-Dblockbranch.deepBasinResult='+dir.file(result).asFile.absolutePath)
    vmArg('-Dblockbranch.deepBasinLegacy='+legacy);vmArg('-Dblockbranch.deepBasinReopen='+reopen)
}
tasks.register('prepareDeepBasinQualification'){doLast{
    assert !dir.file(result).asFile.exists():'Retain evidence; use a fresh directory or reopen phase.'
    if(legacy||reopen)assert dir.file('survey/level.dat').asFile.exists():'Requires actual closed world, not synthesized metadata.'
    else assert !dir.file('server.properties').asFile.exists():'Use a fresh directory.'
    dir.asFile.mkdirs();dir.file('eula.txt').asFile.text='eula=true\n'
    dir.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25620\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed=424242\nmax-tick-time=0\n'
}}
tasks.named('runDeepBasinQualification'){dependsOn 'prepareDeepBasinQualification','relocateDeepBasinReader';doLast{assert dir.file(result).asFile.text.startsWith('PASS')}}

def visual=layout.projectDirectory.dir(providers.gradleProperty('deepBasinVisualDirectory').getOrElse('build/deep-basin-visual'))
def visualLegacy=providers.gradleProperty('deepBasinVisualLegacy').isPresent()
loom.runs.register('deepBasinVisual'){
    client();runDir(visual.asFile.absolutePath);vmArg('-Xmx3G')
    vmArg('-Dblockbranch.deepBasinVisual=true');vmArg('-Dblockbranch.deepBasinVisualDirectory='+visual.asFile.absolutePath)
    vmArg('-Dblockbranch.deepBasinVisualReopen='+visualLegacy)
    programArgs('--username','DeepBasinView','--width','1024','--height','576')
}
tasks.register('prepareDeepBasinVisual'){doLast{
    assert !visual.file('options.txt').asFile.exists():'Preserve captures; use a fresh visual directory.'
    if(visualLegacy)assert visual.dir('saves/DeepBasinVisualReview').asFile.exists():'Copy a closed actual schema261 visual world, never fabricate old metadata.'
    visual.asFile.mkdirs();visual.file('options.txt').asFile.text='renderDistance:10\nsimulationDistance:5\nmaxFps:30\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n'
}}
tasks.named('runDeepBasinVisual'){dependsOn 'prepareDeepBasinVisual';doLast{assert visual.file((visualLegacy?'reopen-':'')+'result.txt').asFile.text.startsWith('PASS')}}
