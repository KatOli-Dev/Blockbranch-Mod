def wildlifeDirectory = layout.projectDirectory.dir(providers.gradleProperty('wildlifeSmokeDirectory').getOrElse('build/wildlife-smoke-v2'))
loom.runs.register('wildlifeSmoke') {
    server()
    name('Wildlife native regression')
    runDir(wildlifeDirectory.asFile.absolutePath)
    vmArg('-Xmx2G')
    vmArg('-Dblockbranch.wildlifeSmoke=true')
    vmArg('-Dblockbranch.wildlifeSmokeResult=' + wildlifeDirectory.file('result.txt').asFile.absolutePath)
    programArg('--nogui')
}
tasks.register('prepareWildlifeSmoke') {
    doLast {
        def directory = wildlifeDirectory.asFile
        directory.mkdirs()
        new File(directory, 'result.txt').delete()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=25585
white-list=false
view-distance=2
simulation-distance=2
level-name=wildlife
level-type=minecraft:flat
level-seed=424242
max-tick-time=120000
'''
    }
}
tasks.named('runWildlifeSmoke') {
    dependsOn tasks.named('prepareWildlifeSmoke')
    doLast { assert wildlifeDirectory.file('result.txt').asFile.text.trim() == 'PASS' }
}

def wildlifeClient = layout.projectDirectory.dir('build/wildlife-client')
def wildlifeServer = layout.projectDirectory.dir('build/wildlife-client-server')
loom.runs.register('wildlifeClientServer') {
    server()
    runDir(wildlifeServer.asFile.absolutePath)
    vmArg('-Xmx2G')
    vmArg('-Dblockbranch.wildlifeReview=true')
    programArg('--nogui')
}
loom.runs.register('wildlifeClientCheck') {
    client()
    runDir(wildlifeClient.asFile.absolutePath)
    vmArg('-Xmx2G')
    vmArg('-Dblockbranch.wildlifeReview=true')
    vmArg('-Dblockbranch.wildlifeClientResult=' + wildlifeClient.file('result.txt').asFile.absolutePath)
    programArgs('--username','WildlifeCheck','--quickPlayMultiplayer','127.0.0.1:25586','--width','1024','--height','576')
}
tasks.register('prepareWildlifeReview') {
    doLast {
        wildlifeServer.asFile.mkdirs()
        wildlifeClient.asFile.mkdirs()
        wildlifeServer.file('eula.txt').asFile.text='eula=true\n'
        wildlifeServer.file('server.properties').asFile.text='''online-mode=false
server-ip=127.0.0.1
server-port=25586
white-list=false
view-distance=8
simulation-distance=2
level-name=wildlife-review
level-type=blockbranch:realistic
level-seed=424242
max-tick-time=120000
'''
        wildlifeClient.file('options.txt').asFile.text='renderDistance:8\nsimulationDistance:5\nmaxFps:60\nenableVsync:false\ntutorialStep:none\n'
    }
}
tasks.named('runWildlifeClientServer') { dependsOn tasks.named('prepareWildlifeReview') }
tasks.named('runWildlifeClientCheck') {
    doFirst { wildlifeClient.file('result.txt').asFile.delete() }
    doLast { assert wildlifeClient.file('result.txt').asFile.text.trim() == 'PASS' }
}

