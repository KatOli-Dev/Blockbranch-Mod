tasks.register('checkLandIce',JavaExec){dependsOn 'testClasses';classpath=sourceSets.test.runtimeClasspath;mainClass='blockbranch.realistic.LandIceCheck';maxHeapSize='2G'}
tasks.named('check'){dependsOn 'checkLandIce'}

// The original source is useful for codec/surface comparisons, but shares
// candidate helpers. Whole-original output hashes are the independent oracle.
def fixture=layout.projectDirectory.dir('src/integrationTest/resources/blockbranch-fixtures/land-ice-reader-262')
def reader=layout.buildDirectory.dir('land-ice-reader-262'),runtime=layout.buildDirectory.dir('land-ice-reader-runtime')
def readerFiles=fileTree(reader).matching{include '**/*.class'}
def snapshotCollector=layout.projectDirectory.file('src/integrationTest/java/blockbranch/realistic/Published262Snapshot.java')
tasks.register('verifyLandIceReader'){
    inputs.dir(fixture);inputs.file(snapshotCollector)
    doLast{
        def origin=new groovy.json.JsonSlurper().parse(fixture.file('ORIGIN.json').asFile)
        assert origin.repository=='KatOli-Dev/Blockbranch-Mod'&&origin.commit=='f68535cd9640c31c0a20c1b889afa42297d4dc6d'
        assert origin.sources*.path.toSet()==['src/main/java/blockbranch/realistic/RealisticGenerator.java','src/main/java/blockbranch/cubic/TerrainProfile.java'].toSet()
        def hash={f->java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
        origin.sources.each{assert hash(fixture.file(it.path.substring('src/main/java/'.length())).asFile)==it.sha256}
        assert hash(fixture.file(origin.baseline.path).asFile)==origin.baseline.sha256
        assert hash(snapshotCollector.asFile)==origin.baseline.collectorSha256
    }
}
tasks.named('checkHistoricalReaderFixtures'){dependsOn 'verifyLandIceReader'}
tasks.register('compileLandIceReader',JavaCompile){
    dependsOn 'classes','verifyLandIceReader';source fixture.asFile;include '**/*.java'
    classpath=sourceSets.main.output+sourceSets.main.compileClasspath;destinationDirectory=reader
    javaCompiler=javaToolchains.compilerFor{languageVersion=JavaLanguageVersion.of(25)}
    options.release=25;options.compilerArgs.add('-proc:none')
}
tasks.register('relocateLandIceReader'){
    dependsOn 'compileLandIceReader';inputs.dir(reader);outputs.dir(runtime)
    doLast{readerFiles.files.each{inputFile->
        def bytes=new ByteArrayOutputStream()
        inputFile.withDataInputStream{input->
            def output=new DataOutputStream(bytes);output.writeInt(input.readInt());output.writeShort(input.readUnsignedShort());output.writeShort(input.readUnsignedShort())
            int count=input.readUnsignedShort();output.writeShort(count)
            for(int i=1;i<count;i++){
                int tag=input.readUnsignedByte();output.writeByte(tag)
                if(tag==1){def value=input.readUTF();if(inputFile.path.replace('\\','/').contains('/blockbranch/cubic/TerrainProfile'))value=value.replace('blockbranch/cubic/TerrainProfile','blockbranch/cubic/Published262TerrainProfile');output.writeUTF(value.replace('blockbranch/realistic/RealisticGenerator','blockbranch/realistic/Published262RealisticGenerator'))}
                else{int length=tag in [3,4,9,10,11,12,17,18]?4:tag in [5,6]?8:tag in [7,8,16,19,20]?2:tag==15?3:-1;assert length>0;output.write(input.readNBytes(length));if(tag in [5,6])i++}
            }
            output.write(input.readAllBytes());output.flush()
        }
        def relative=reader.get().asFile.toPath().relativize(inputFile.toPath()).toString().replace('RealisticGenerator','Published262RealisticGenerator').replace('TerrainProfile','Published262TerrainProfile')
        def target=runtime.get().file(relative).asFile;target.parentFile.mkdirs();target.bytes=bytes.toByteArray()
    }}
}
sourceSets.integrationTest.output.dir([builtBy:'relocateLandIceReader'],runtime)

def dir=layout.projectDirectory.dir(providers.gradleProperty('landIceDirectory').getOrElse('build/land-ice-native'))
def legacy=providers.gradleProperty('landIceLegacy').isPresent(),reopen=providers.gradleProperty('landIceReopen').isPresent()
def probe=providers.gradleProperty('landIceProbe').isPresent()
def result=(probe?'probe-':reopen?'reopen-':'')+'result.txt'
loom.runs.register('landIceQualification'){
    server();runDir(dir.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
    vmArg('-Dblockbranch.landIceProbe='+probe);vmArg('-Dblockbranch.landIceQualification=true');vmArg('-Dblockbranch.landIceResult='+dir.file(result).asFile.absolutePath)
    vmArg('-Dblockbranch.landIceLegacy='+legacy);vmArg('-Dblockbranch.landIceReopen='+reopen)
}
tasks.register('prepareLandIceQualification'){doLast{
    assert !dir.file(result).asFile.exists():'Retain evidence; use a fresh directory or reopen phase.'
    if(legacy||reopen||probe)assert dir.file('survey/level.dat').asFile.exists():'Requires actual closed world, not synthesized metadata.'
    else assert !dir.file('server.properties').asFile.exists():'Use a fresh directory.'
    dir.asFile.mkdirs();dir.file('eula.txt').asFile.text='eula=true\n'
    dir.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25621\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed=424242\nmax-tick-time=0\n'
}}
tasks.named('runLandIceQualification'){dependsOn 'prepareLandIceQualification','relocateLandIceReader';doLast{assert dir.file(result).asFile.text.startsWith('PASS')}}


