def coveragePreset=providers.gradleProperty('overworldPreset').getOrElse('blockbranch:integrated_coverage')
def coverageDir=layout.projectDirectory.dir(providers.gradleProperty('overworldCoverageDirectory').getOrElse('build/overworld-coverage-current'))
loom.runs.register('overworldCoverage'){
 server();runDir(coverageDir.asFile.absolutePath);vmArg('-Xmx3G');vmArg('-Dblockbranch.overworldCoverage=true');programArg('--nogui')
}
tasks.named('runOverworldCoverage'){doFirst{
 coverageDir.asFile.mkdirs();coverageDir.file('result.txt').asFile.delete();coverageDir.file('eula.txt').asFile.text='eula=true\n'
 coverageDir.file('server.properties').asFile.text='online-mode=false\npause-when-empty-seconds=0\nserver-ip=127.0.0.1\nserver-port=25629\nview-distance=2\nsimulation-distance=2\nlevel-name=structures\nlevel-type='+coveragePreset+'\nlevel-seed=424242\nmax-tick-time=600000\n'
};doLast{assert coverageDir.file('result.txt').asFile.text=='PASS'}}
