def viewDir=layout.projectDirectory.dir(providers.gradleProperty('overworldViewDirectory').getOrElse('build/overworld-view-current'))
loom.runs.register('overworldView'){
 client();runDir(viewDir.asFile.absolutePath);vmArg('-Xmx3G');vmArg('-Dblockbranch.overworldView=true');vmArg('-Dblockbranch.overworldViewSites='+providers.gradleProperty('overworldViewSites').getOrElse('village_plains,village_taiga,abandoned_camp_swamp,monument,ancient_city,trial_chambers'));vmArg('-Dblockbranch.overworldViewDir='+viewDir.asFile.absolutePath);vmArg('-Dblockbranch.overworldViewWitness='+coverageDir.file('starts.json').asFile.absolutePath);programArgs('--username','CoverageReview','--width','1024','--height','576')
}
tasks.register('prepareOverworldView'){doLast{
 viewDir.asFile.mkdirs();def world=viewDir.dir('saves/OverworldCoverage');
 if(!world.file('level.dat').asFile.exists()){
  ['level.dat','blockbranch-columns.txt','data/minecraft/world_gen_settings.dat','data/fabric/registry_entries.dat'].each{name->def target=world.file(name).asFile.toPath();java.nio.file.Files.createDirectories(target.parent);java.nio.file.Files.copy(functionDir.dir('structures').file(name).asFile.toPath(),target)}
 }
 viewDir.file('result.txt').asFile.delete();viewDir.file('options.txt').asFile.text='renderDistance:6\nsimulationDistance:5\nmaxFps:30\nenableVsync:false\npauseOnLostFocus:false\nonboardAccessibility:false\nlang:en_us\ntutorialStep:none\nsoundCategory_music:0.0\n'
}}
tasks.named('runOverworldView'){dependsOn 'prepareOverworldView';doLast{assert viewDir.file('result.txt').asFile.text.startsWith('PASS')}}
