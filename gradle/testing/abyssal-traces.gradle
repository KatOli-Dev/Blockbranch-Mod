loom.runs.register('abyssalTraceVisual'){
    client();runDir(visualDir.asFile.absolutePath);vmArg('-Xmx3G')
    vmArg('-Dblockbranch.abyssalTraceVisual=true');vmArg('-Dblockbranch.abyssalTraceVisualDirectory='+visualDir.asFile.absolutePath)
    programArgs('--username','AbyssalTraceView','--width','1024','--height','576')
}
tasks.register('prepareAbyssalTraceVisual'){doLast{
