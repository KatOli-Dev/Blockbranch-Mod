tasks.register('checkSummerDry',JavaExec){dependsOn 'testClasses';classpath=sourceSets.test.runtimeClasspath;mainClass='blockbranch.realistic.SummerDryCheck';maxHeapSize='2G'}
tasks.named('check'){dependsOn 'checkSummerDry'}

// The original source is useful for codec/surface comparisons, but shares
// candidate helpers. Whole-original output hashes are the independent oracle.
def fixture=layout.projectDirectory.dir('src/integrationTest/resources/blockbranch-fixtures/summer-dry-reader-263')
def reader=layout.buildDirectory.dir('summer-dry-reader-263'),runtime=layout.buildDirectory.dir('summer-dry-reader-runtime')
def readerFiles=fileTree(reader).matching{include '**/*.class'}
def snapshotCollector=layout.projectDirectory.file('src/integrationTest/java/blockbranch/realistic/Published263Snapshot.java')
tasks.register('verifySummerDryReader'){
    inputs.dir(fixture);inputs.file(snapshotCollector)
    doLast{
        def origin=new groovy.json.JsonSlurper().parse(fixture.file('ORIGIN.json').asFile)
        assert origin.repository=='KatOli-Dev/Blockbranch-Mod'&&origin.commit=='c031463a3c01cf19f587517a5c0f627fd8813e2b'
        assert origin.sources*.path.toSet()==['src/main/java/blockbranch/realistic/RealisticGenerator.java','src/main/java/blockbranch/realistic/ScreeBiomeSource.java','src/main/java/blockbranch/cubic/TerrainProfile.java'].toSet()
        def hash={f->java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
        origin.sources.each{assert hash(fixture.file(it.path.substring('src/main/java/'.length())).asFile)==it.sha256}
        assert hash(fixture.file(origin.baseline.path).asFile)==origin.baseline.sha256
        assert hash(snapshotCollector.asFile)==origin.baseline.collectorSha256
    }
}
tasks.named('checkHistoricalReaderFixtures'){dependsOn 'verifySummerDryReader'}
tasks.register('compileSummerDryReader',JavaCompile){
    dependsOn 'classes','verifySummerDryReader';source fixture.asFile;include '**/*.java'
    classpath=sourceSets.main.output+sourceSets.main.compileClasspath;destinationDirectory=reader
    javaCompiler=javaToolchains.compilerFor{languageVersion=JavaLanguageVersion.of(25)}
    options.release=25;options.compilerArgs.add('-proc:none')
}
tasks.register('relocateSummerDryReader'){
    dependsOn 'compileSummerDryReader';inputs.dir(reader);outputs.dir(runtime)
    doLast{readerFiles.files.each{inputFile->
        def bytes=new ByteArrayOutputStream()
        inputFile.withDataInputStream{input->
            def output=new DataOutputStream(bytes);output.writeInt(input.readInt());output.writeShort(input.readUnsignedShort());output.writeShort(input.readUnsignedShort())
            int count=input.readUnsignedShort();output.writeShort(count)
            for(int i=1;i<count;i++){
                int tag=input.readUnsignedByte();output.writeByte(tag)
                if(tag==1){def value=input.readUTF();if(inputFile.path.replace('\\','/').contains('/blockbranch/cubic/TerrainProfile'))value=value.replace('blockbranch/cubic/TerrainProfile','blockbranch/cubic/Published263TerrainProfile');output.writeUTF(value.replace('blockbranch/realistic/RealisticGenerator','blockbranch/realistic/Published263RealisticGenerator').replace('blockbranch/realistic/ScreeBiomeSource','blockbranch/realistic/Published263ScreeBiomeSource'))}
                else{int length=tag in [3,4,9,10,11,12,17,18]?4:tag in [5,6]?8:tag in [7,8,16,19,20]?2:tag==15?3:-1;assert length>0;output.write(input.readNBytes(length));if(tag in [5,6])i++}
            }
            output.write(input.readAllBytes());output.flush()
        }
        def relative=reader.get().asFile.toPath().relativize(inputFile.toPath()).toString().replace('RealisticGenerator','Published263RealisticGenerator').replace('TerrainProfile','Published263TerrainProfile').replace('ScreeBiomeSource','Published263ScreeBiomeSource')
        def target=runtime.get().file(relative).asFile;target.parentFile.mkdirs();target.bytes=bytes.toByteArray()
    }}
}
sourceSets.integrationTest.output.dir([builtBy:'relocateSummerDryReader'],runtime)


