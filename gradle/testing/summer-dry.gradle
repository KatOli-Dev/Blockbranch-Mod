def resultName=(savedPlanOnly?'plan-':'')+(reopen?'reopen-':'')+'result.txt'
loom.runs.register('summerDryQualification'){
 server();runDir(dir.asFile.absolutePath);vmArg('-Xmx3G');programArg('--nogui')
 vmArg('-Dblockbranch.summerDryQualification=true');vmArg('-Dblockbranch.summerDryResult='+dir.file(resultName).asFile.absolutePath)
 vmArg('-Dblockbranch.summerDryNativeOnly='+providers.gradleProperty('summerDryNativeOnly').isPresent());vmArg('-Dblockbranch.summerDrySavedPlanOnly='+savedPlanOnly);vmArg('-Dblockbranch.summerDryLegacy='+legacy);vmArg('-Dblockbranch.summerDryReopen='+reopen);vmArg('-Dblockbranch.summerDrySurvey='+providers.gradleProperty('summerDrySurvey').isPresent())
}
tasks.register('prepareSummerDryQualification'){doLast{
 assert !dir.file(resultName).asFile.exists():'Preserve results; choose a fresh directory or reopen phase.'
 if(legacy||reopen)assert dir.file('survey/level.dat').asFile.exists():'Requires an actual closed saved world, never synthesized metadata.'
 else assert !dir.file('server.properties').asFile.exists():'Use a fresh directory.'
 dir.asFile.mkdirs();dir.file('eula.txt').asFile.text='eula=true\n'
 dir.file('server.properties').asFile.text='online-mode=false\nserver-ip=127.0.0.1\nserver-port=25622\nview-distance=2\nsimulation-distance=2\nlevel-name=survey\nlevel-type=blockbranch:realistic\nlevel-seed=424242\nmax-tick-time=0\n'
}}
tasks.named('runSummerDryQualification'){dependsOn 'prepareSummerDryQualification','relocateSummerDryReader';doLast{assert dir.file(resultName).asFile.text.startsWith('PASS')}}

