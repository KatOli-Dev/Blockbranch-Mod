def metallurgyWorldType=providers.gradleProperty('metallurgyRealistic').isPresent()?'blockbranch:realistic':'minecraft:flat'
def metallurgyDir=layout.projectDirectory.dir(providers.gradleProperty('metallurgyDirectory').getOrElse('build/metallurgy-native'))
loom.runs.register('metallurgySmoke'){
 server();if(providers.gradleProperty('metallurgyExpectedOre').isPresent())vmArg('-Dblockbranch.metallurgyExpectedOre='+providers.gradleProperty('metallurgyExpectedOre').get());runDir(metallurgyDir.asFile.absolutePath);vmArg('-Xmx2G');programArg('--nogui')
 vmArg('-Dblockbranch.metallurgyLegacy='+providers.gradleProperty('metallurgyLegacy').isPresent());vmArg('-Dblockbranch.metallurgySmoke=true');vmArg('-Dblockbranch.metallurgyDirectory='+metallurgyDir.asFile.absolutePath)
 vmArg('-Dblockbranch.oldZincCatalogClasses='+oldZincCatalogClasses.get().asFile.absolutePath)
 vmArg('-Dblockbranch.oldArmorCatalogClasses='+oldArmorCatalogClasses.get().asFile.absolutePath)
 vmArg('-Dblockbranch.oldToolCatalogClasses='+oldToolCatalogClasses.get().asFile.absolutePath)
 vmArg('-Dblockbranch.oldCatalogClasses='+oldCatalogClasses.get().asFile.absolutePath)
 vmArg('-Dblockbranch.oldOreClasses='+oldOreClasses.get().asFile.absolutePath)
}
tasks.named('runMetallurgySmoke'){
 dependsOn oldOreCompile,oldCatalogCompile,oldToolCatalogCompile,oldArmorCatalogCompile,oldZincCatalogCompile
 doFirst{
  metallurgyDir.asFile.mkdirs();metallurgyDir.file('result.txt').asFile.delete();metallurgyDir.file('eula.txt').asFile.text='eula=true\n'
  def properties=metallurgyDir.file('server.properties').asFile
  if(!properties.exists())properties.text='online-mode=false\nwhite-list=false\nserver-ip=127.0.0.1\nserver-port=25621\nlevel-name=metallurgy\nlevel-type='+metallurgyWorldType+'\nlevel-seed=424242\nview-distance=2\nsimulation-distance=2\nmax-tick-time=240000\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\n'
 }
 doLast{assert metallurgyDir.file('result.txt').asFile.exists()&&metallurgyDir.file('result.txt').asFile.text.startsWith('PASS'):'Native metallurgy qualification failed; inspect fixture logs'}
}

