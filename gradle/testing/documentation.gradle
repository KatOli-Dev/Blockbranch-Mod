// Keep maintained references small without a Python or Git prerequisite.
def documentation = fileTree(projectDir) {
    include '**/*.md'
    exclude '.git/**', '.gradle/**', 'build/**', 'run/**', '**/build/**', '**/node_modules/**'
}
def maintainedReferences = fileTree('docs')
def documentationRoot = projectDir
tasks.register('checkDocumentation') {
    group = 'verification'
    description = 'Checks documentation size, maintained references and local link targets.'
    inputs.files(documentation, maintainedReferences)
    doLast {
        def expected = ['DEVELOPMENT.md', 'SAVE_COMPATIBILITY.md'] as Set
        def actual = maintainedReferences.files.collect {
            new File(documentationRoot, 'docs').toPath().relativize(it.toPath()).toString()
        } as Set
        assert actual == expected : 'Keep docs/ to the two maintained references: ' + expected
        for (doc in documentation.files.sort()) {
            def lines = doc.readLines('UTF-8')
            assert lines.size() <= 500 : documentationRoot.toPath().relativize(doc.toPath()).toString() + ' has ' + lines.size() + ' lines (limit 500)'
            // Code fences may contain example links, not actual Markdown destinations.
            boolean fenced = false
            for (line in lines) {
                if (line.trim().startsWith('```') || line.trim().startsWith('~~~')) {
                    fenced = !fenced
                    continue
                }
                if (fenced) continue
                def links = line =~ /!?\[[^\]]*\]\(([^\s)]+)(?:\s+"[^"]*")?\)/
                while (links.find()) {
                    def target = links.group(1)
                    if (target ==~ /[a-zA-Z][a-zA-Z0-9+.-]*:.*/) continue
                    def path = target.split('#', 2)[0]
                    if (path.empty) continue
                    def destination = new File(doc.parentFile, java.net.URLDecoder.decode(path, 'UTF-8'))
                    assert destination.exists() : documentationRoot.toPath().relativize(doc.toPath()).toString() + ': missing local link ' + target
                }
            }
            println documentationRoot.toPath().relativize(doc.toPath()).toString() + ': ' + lines.size() + ' lines; local link targets exist'
        }
    }
}
tasks.named('check') { dependsOn tasks.named('checkDocumentation') }
